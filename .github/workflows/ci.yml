name: CI

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on another PR's branch.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The suite starts its own backend, points the Vobiz API at a closed port
      # so nothing can place a call, and exits non-zero on any failure,
      # including the security properties.
      - name: Test suite
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A credential in a public repository is a published credential.
      - name: No committed credentials
        run: |
          set -e
          if [ -f backend/.env ]; then echo "backend/.env is committed"; exit 1; fi
          if grep -rIn '"sipPassword"' --include='*.json' . ; then
            echo "agents.json is committed; it must not carry a SIP password field"; exit 1
          fi
          # Scoped to the shipped code: the suite in scripts/ names the
          # pattern on purpose, to assert its absence.
          if grep -rInE 'ClickUpAgent#|pk_[0-9]{6,}_' --include='*.js' --include='*.json' backend/ clickup-app/ ; then
            echo "a hardcoded credential must not come back"; exit 1
          fi
          # Matches a media fetch whose destination comes from the request,
          # rather than the words "recording-file" — the API note and its test
          # both mention that by name.
          if grep -rInE 'query\.url' --include='*.js' backend/ ; then
            echo "a caller-supplied media URL must not come back"; exit 1
          fi
          if grep -rIn 'Access-Control-Allow-Origin", "\*"' --include='*.js' backend/ ; then
            echo "wildcard CORS must not come back"; exit 1
          fi
          echo "clean"
